name: compraclara
description: CompraClara - lista de la compra inteligente por secciones del supermercado.
publish_to: 'none'
version: 0.5.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  http: ^1.2.2
  mobile_scanner: ^6.0.2
  geolocator: ^14.0.0
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  file_picker: ^10.1.0
  speech_to_text: ^7.0.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  quick_actions: ^1.1.0
  barcode_widget: ^2.0.4
  package_info_plus: ^8.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

# Icono de la app (assets/brand): se genera en la compilación.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/png/icono-1024.png"
  adaptive_icon_background: "#2E7D5B"
  adaptive_icon_foreground: "assets/brand/png/icono-primer-plano.png"
  adaptive_icon_monochrome: "assets/brand/png/icono-monocromo.png"
  min_sdk_android: 23

# Pantalla de arranque con el logotipo sobre el verde de la marca.
flutter_native_splash:
  color: "#2E7D5B"
  image: "assets/brand/png/arranque.png"
  android_12:
    color: "#2E7D5B"
    image: "assets/brand/png/arranque.png"
  ios: false
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/brand/png/icono-play-512.png
