name: compraclara
description: CompraClara - lista de la compra inteligente por secciones del supermercado.
publish_to: 'none'
version: 0.3.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  http: ^1.2.2
  mobile_scanner: ^6.0.2
  geolocator: ^14.0.0
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  file_picker: ^10.1.0
  speech_to_text: ^7.0.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  quick_actions: ^1.1.0
  barcode_widget: ^2.0.4
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
