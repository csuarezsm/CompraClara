name: Compilar Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versiones
        run: flutter --version

      - name: Generar proyecto Android
        run: flutter create --platforms=android --org com.itcanarias --project-name compraclara .

      - name: Ajustar permisos y nombre
        run: bash tool/patch_android.sh

      - name: Quitar test de ejemplo
        run: rm -f test/widget_test.dart

      - name: Dependencias
        run: flutter pub get

      - name: Analizar
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compilar APK
        run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}

      - name: Firmar APK (clave de los secretos si existe)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          IN=build/app/outputs/flutter-apk/app-release.apk
          OUT=build/CompraClara.apk
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
            "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD --out "$OUT" "$IN"
            "$APKSIGNER" verify --print-certs "$OUT" | head -3
          else
            echo "Sin clave en secretos: firma de depuración (cambia en cada compilación)"
            cp "$IN" "$OUT"
          fi

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: compraclara-apk
          path: build/CompraClara.apk

      - name: Publicar en Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: CompraClara 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: build/CompraClara.apk
          body: |
            Compilación automática (MVP interno, solo Android).
            Descarga CompraClara.apk en el móvil e instálala.
